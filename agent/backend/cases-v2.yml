- case_id: product-tool-rag-joint-answer
  user_message: 降噪耳机现在的标价、活动价和库存分别是多少？另外，平台 618 满减的一般规则是什么？
  expected_answer_claims:
  - label: 标价 599 元
    pattern: (?:标价|原价).{0,8}(?:￥|¥)?\s*599(?:\.0{1,2})?\s*元?
  - label: 活动价 529 元
    pattern: (?:活动价|促销价).{0,8}(?:￥|¥)?\s*529(?:\.0{1,2})?\s*元?
  - label: 库存 520 件
    pattern: (?:库存.{0,8}520\s*(?:件|个)?|520\s*(?:件|个).{0,8}库存)
  - label: 满 300 减 40
    pattern: 满\s*300(?:\s*元)?(?:\s*可)?\s*减\s*40(?:\s*元)?
  - label: 以商品页和结算页为准
    pattern: (?:具体|最终)?\s*以?\s*商品(?:详情)?页(?:面)?\s*(?:和|与|、)\s*结算页(?:面)?\s*(?:的)?\s*(?:实际)?\s*(?:显示|展示|信息)?\s*为准
  forbidden_answer_claims:
  - label: 不得否定商品页和结算页依据
    pattern: (?:不能|不可|不应|不是|并非|无需|别).{0,6}(?:以)?.{0,2}商品(?:详情)?页(?:面)?.{0,6}结算页(?:面)?.{0,6}为准
  expected_tools:
  - search_products
  expected_citations:
  - promotion_618_stack_rule
  expected_trace_events:
  - rag_pre_retrieved
  - context_source_safety_checked
  - mcp_binding_resolved
  - cost_recorded
  expected_session_state:
  - intent=product_query
  - memory.last_product_name=降噪蓝牙耳机
  - mcp.selected_tool=search_products
